<!doctype html>
<!--
  The Joules share card. One file, no server: it draws the card from the DATA line below and offers it as
  an image and a ready post. To make someone's card, copy this file and replace that one line
  (`joules card` does it for you). Add #png to the address to show the card alone, for a screenshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joules</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #050506; color: #fafafa; font: 16px/1.5 InterCard, Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 56px; }
  #card svg { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 14px; }
  .actions button, .actions a { font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16); background: #18181b; color: #fafafa; cursor: pointer; text-decoration: none; }
  .actions button:hover, .actions a:hover { background: #27272a; }
  .actions .main { background: #fafafa; border-color: #fafafa; color: #18181b; }
  .actions .main:hover { background: #e4e4e7; }
  textarea { box-sizing: border-box; width: 100%; min-height: 128px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: #0f0f12; color: #e4e4e7; font: inherit; resize: vertical; }
  p { color: #a1a1aa; font-size: 14px; margin: 10px 0 0; }
  .png body { background: #0b0b10; overflow: hidden; }
  .png main { max-width: none; padding: 0; }
  .png #card svg { width: 1200px; height: 675px; border-radius: 0; box-shadow: none; }
  .png .actions, .png textarea, .png p { display: none; }
</style>
</head>
<body>
<main>
  <div id="card"></div>
  <div class="actions">
    <button id="copy" class="main">Copy image</button>
    <button id="save">Download PNG</button>
    <a id="post" target="_blank" rel="noopener">Post on X</a>
  </div>
  <textarea id="text" aria-label="Post text" spellcheck="false"></textarea>
  <p>A post link can't carry an image: copy the image, press Post on X, then paste it in. The text is yours to edit.</p>
</main>
<script>
// The numbers on the card: replace this one line. `bars` is Joules over time, oldest first (per day, or per week for a year).
// Optional `baseline`: a team's own Joules per weekday before AI, in place of the measured 8.2.
const DATA = {"who":"@ada","period":"4 weeks to 26 Nov 2026","joules":1612,"weekdays":20,"prs":41,"bars":[64,0,0,38,112,71,0,96,0,12,45,134,88,57,120,0,0,76,41,163,92,68,9,0,54,108,85,79]};

// Joules per weekday, measured (data/): the median engineer before AI, then engineers shipping with AI at the
// 25th and 40th percentile, the median, the top 10% and the highest. The names are ours.
const LADDER = [["Pre-AI", 8.2], ["Autocomplete", 12.5], ["Vibe coder", 17.8], ["Good", 21.7], ["Cracked", 75.5], ["God", 415.4]];
const MEDIAN = 21.7;
const COLORS = { "Pre-AI": "#f87171", Autocomplete: "#fb923c", "Vibe coder": "#facc15", Good: "#4ade80", Cracked: "#c084fc", God: "#67e8f9" };
const LINK = "github.com/tolypash/joules";
const W = 1200;
const H = 675;
const PAD = 64;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const whole = (n) => Math.round(n).toLocaleString("en-US");
/** One decimal under 100 (21.7), none above (415). */
const short = (n) => (n >= 100 ? whole(n) : String(Math.round(n * 10) / 10));

// Output: Joules per weekday as a percentage of the median engineer before AI (or the team's own pre-AI line, `baseline`).
const baseline = DATA.baseline || LADDER[0][1];
const pct = (joulesPerWeekday) => (joulesPerWeekday / baseline) * 100;
const perWeekday = DATA.joules / Math.max(1, DATA.weekdays);
const output = `${whole(pct(perWeekday))}%`;
const times = perWeekday / MEDIAN;
const timesText = `${times >= 10 ? whole(times) : short(times)}×`;
/** The highest rung reached, if any. A team's own pre-AI line moves the first rung to it. */
const rungs = LADDER.map(([name, v], i) => ({ name, v: i ? v : baseline, color: COLORS[name] })).filter((r, i) => !i || r.v > baseline);
const rank = rungs.filter((r) => perWeekday >= r.v).pop();

function draw() {
  const color = rank?.color ?? "#a1a1aa";
  // God is every colour at once.
  const paint = rank?.name === "God" ? "url(#god)" : color;
  const digits = whole(pct(perWeekday));
  const size = digits.length <= 5 ? 196 : digits.length === 6 ? 168 : 144;
  const track = W - 2 * PAD;
  // A log scale: each doubling of output is the same step, so the low rungs don't crowd when the top one is far out.
  // It starts a little below the first rung to leave the grey stretch before it; anything lower sits at the start.
  const start = rungs[0].v / 1.5;
  const end = Math.max(rungs.at(-1).v * 1.09, perWeekday * 1.04);
  const at = (v) => PAD + (track * Math.log(Math.max(v, start) / start)) / Math.log(end / start);
  const you = at(perWeekday);

  // Joules over time, as a skyline on the right, the best bar at full strength.
  const bars = (DATA.bars ?? []).map(Number);
  const box = { x: 772, y: 150, w: W - PAD - 772, h: 232 };
  const gap = bars.length > 30 ? 2.5 : bars.length > 14 ? 4 : 10;
  const bw = bars.length ? (box.w - gap * (bars.length - 1)) / bars.length : 0;
  const tallest = Math.max(1, ...bars);
  const skyline = bars
    .map((j, i) => {
      const h = j > 0 ? Math.max(6, (j / tallest) * box.h) : 3;
      return `<rect x="${(box.x + i * (bw + gap)).toFixed(1)}" y="${(box.y + box.h - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, bw / 2).toFixed(1)}" fill="${paint}" opacity="${j === tallest ? 1 : j > 0 ? 0.45 : 0.18}"/>`;
    })
    .join("");
  const chart = bars.length
    ? `${skyline}<text x="${W - PAD}" y="${box.y + box.h + 34}" text-anchor="end" font-size="16" font-weight="500" fill="#a1a1aa">Joules per ${bars.length > 31 ? "week" : "day"}</text>`
    : "";

  // The rung reached, in its colour; textLength pins the text to the width the pill was sized for.
  const pillText = (rank?.name ?? "").toUpperCase();
  const pillW = pillText.length * 13.2 + 46;
  const pill = rank
    ? `<rect x="${W - PAD - pillW}" y="452" width="${pillW}" height="46" rx="23" fill="${paint}"/>
<text x="${W - PAD - pillW / 2}" y="482" text-anchor="middle" font-size="18" font-weight="800" fill="#0b0b10" textLength="${pillW - 46}" lengthAdjust="spacing">${esc(pillText)}</text>`
    : "";

  // One coloured stretch per rung, from where it starts to where the next does; what lies past "you" is dimmed.
  const stretch = (from, to, fill) => `<rect x="${from.toFixed(1)}" y="548" width="${Math.max(0, to - from).toFixed(1)}" height="12" fill="${fill}"/>`;
  const line = [stretch(PAD, at(rungs[0].v), "#52525b"), ...rungs.map((r, i) => stretch(at(r.v), i + 1 < rungs.length ? at(rungs[i + 1].v) : W - PAD, r.name === "God" ? "url(#god)" : r.color))].join("");
  // Names sit under the line; one that would run into its neighbour goes above it instead (then on a second row below).
  const rows = [{ y: 590, end: 0 }, { y: 534, end: 0 }, { y: 614, end: 0 }];
  const names = rungs
    .map((r, i) => {
      const x = at(r.v);
      const value = `${whole(pct(r.v))}%`;
      const last = i === rungs.length - 1;
      const width = r.name.length * 8.4 + value.length * 8.2 + 5;
      const from = last ? x - width : x;
      const row = rows.find((o) => from >= o.end + 12) ?? rows[2];
      row.end = from + width;
      const tick = row.y < 548 ? `y="${row.y + 5}" height="${543 - row.y}"` : `y="560" height="${row.y - 574}"`;
      return `<rect x="${(x - 1).toFixed(1)}" ${tick} width="2" fill="${r.color}" opacity="0.7"/>
<text x="${(last ? x + 1 : x - 1).toFixed(1)}" y="${row.y}" text-anchor="${last ? "end" : "start"}" font-size="14" font-weight="700" fill="${r.color}">${r.name} <tspan font-weight="500" fill="#a1a1aa">${value}</tspan></text>`;
    })
    .join("\n");

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`${DATA.who}: ${output} output, ${DATA.period}`)}">
<defs>
<style>@font-face{font-family:InterCard;font-weight:100 900;src:url(data:font/woff2;base64,${FONT}) format("woff2")}text{font-family:InterCard,Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<linearGradient id="god" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#f0abfc"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<radialGradient id="aura" cx="0.88" cy="0.02" r="0.8"><stop offset="0" stop-color="${color}" stop-opacity="0.28"/><stop offset="0.55" stop-color="${color}" stop-opacity="0.07"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient>
<radialGradient id="floor" cx="0.05" cy="1.05" r="0.6"><stop offset="0" stop-color="${color}" stop-opacity="0.16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fafafa" stroke-opacity="0.035"/></pattern>
<clipPath id="round"><rect x="${PAD}" y="548" width="${track}" height="12" rx="6"/></clipPath>
<clipPath id="done"><rect x="0" y="540" width="${you.toFixed(1)}" height="30"/></clipPath>
</defs>
<rect width="${W}" height="${H}" fill="#0b0b10"/>
<rect width="${W}" height="${H}" fill="url(#grid)"/>
<rect width="${W}" height="${H}" fill="url(#aura)"/>
<rect width="${W}" height="${H}" fill="url(#floor)"/>

<polygon points="${PAD + 21},50 ${PAD + 3},74 ${PAD + 18},74 ${PAD + 15},92 ${PAD + 33},66 ${PAD + 18},66" fill="${paint}"/>
<text x="${PAD + 46}" y="83" font-size="32" font-weight="800" letter-spacing="-0.8" fill="#fafafa">Joules</text>
<text x="${PAD + 160}" y="82" font-size="18" font-weight="500" fill="#a1a1aa">value shipped, not lines of code or number of PRs</text>
<text x="${W - PAD}" y="82" text-anchor="end" font-size="17" font-weight="600" letter-spacing="2.2" fill="#d4d4d8">${esc(String(DATA.period).toUpperCase())}</text>

<text x="${PAD}" y="168" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#fafafa">${esc(DATA.who)}</text>
<text x="${PAD - 6}" y="328" font-size="${size}" font-weight="800" letter-spacing="${(-size * 0.045).toFixed(1)}" fill="#fafafa">${digits}<tspan dx="${(size * 0.05).toFixed(0)}" font-size="${(size * 0.6).toFixed(0)}" letter-spacing="0" fill="${paint}">%</tspan></text>
<text x="${PAD}" y="398" font-size="25" font-weight="600" fill="#fafafa">of what an engineer shipped before AI</text>
<text x="${PAD}" y="430" font-size="18" font-weight="500" fill="#a1a1aa">${whole(DATA.joules)} Joules shipped${DATA.prs ? ` · ${whole(DATA.prs)} PR${DATA.prs === 1 ? "" : "s"} merged` : ""}</text>
${chart}

<text x="${PAD}" y="492" font-size="30" font-weight="500" fill="#fafafa"><tspan font-size="56" font-weight="800" letter-spacing="-1.5" fill="${paint}">${timesText}</tspan><tspan dx="16">the median engineer shipping with AI</tspan></text>
${pill}

<g clip-path="url(#round)"><g opacity="0.28">${line}</g><g clip-path="url(#done)">${line}</g></g>
${names}
<circle cx="${you.toFixed(1)}" cy="554" r="12" fill="#fafafa" stroke="#0b0b10" stroke-width="4"/>

<text x="${PAD}" y="650" font-size="15" fill="#71717a">Value shipped per weekday. 100% is the median engineer before AI.</text>
<text x="${W - PAD}" y="650" text-anchor="end" font-size="17" font-weight="600" fill="#d4d4d8">${LINK}</text>
</svg>`;
}

/** The card as a PNG at twice its size, drawn by the browser. */
function png(markup) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error("could not draw the card"));
    // Safari paints an SVG's own font a moment after it loads.
    img.onload = () =>
      setTimeout(() => {
        const canvas = Object.assign(document.createElement("canvas"), { width: W * 2, height: H * 2 });
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("could not draw the card"))), "image/png");
      }, 150);
    img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(markup)}`;
  });
}

function start() {
  const markup = draw();
  if (location.hash === "#png") document.documentElement.classList.add("png");
  document.title = `Joules · ${DATA.who}`;
  document.getElementById("card").innerHTML = markup;

  const text = document.getElementById("text");
  text.value = `⚡ ${output} output · ${DATA.period}\n${timesText} the median engineer shipping with AI${rank ? ` (${rank.name})` : ""}\n\n${LINK}`;
  const post = document.getElementById("post");
  const link = () => (post.href = `https://x.com/intent/post?text=${encodeURIComponent(text.value)}`);
  text.addEventListener("input", link);
  link();

  const download = async () => {
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await png(markup)), download: "joules-card.png" });
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById("save").addEventListener("click", download);
  document.getElementById("copy").addEventListener("click", async ({ target }) => {
    target.textContent = "Copying…";
    try {
      // The image goes in as a promise, so Safari still counts it as part of the click.
      await navigator.clipboard.write([new ClipboardItem({ "image/png": png(markup) })]);
      target.textContent = "Copied";
    } catch {
      await download();
      target.textContent = "Downloaded instead";
    }
    setTimeout(() => (target.textContent = "Copy image"), 1800);
  });
}
