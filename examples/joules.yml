# Copy to .github/workflows/joules.yml. Add one secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`) or ANTHROPIC_API_KEY.
# Optional: LINEAR_API_KEY, or JIRA_BASE_URL + JIRA_EMAIL + JIRA_API_TOKEN, to post scores on the linked ticket.
name: Joules
on:
  pull_request:
    types: [opened, ready_for_review, closed]
  schedule:
    - cron: "0 6 * * *" # settles PRs merged 14+ days ago
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  joules:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: tolypash/joules@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
